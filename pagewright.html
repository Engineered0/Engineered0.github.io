/* Pagewright: a maker's bench. Pages lie on a green self-healing cutting mat with a
   measuring grid; the chrome is plain and quiet; edits are marked in proofing magenta. */
:root {
  --desk: #2f5f4f;          /* the cutting mat */
  --grid: rgba(255, 255, 255, .055);
  --grid-major: rgba(255, 255, 255, .11);
  --panel: #f8faf8;         /* chrome and side panels */
  --panel-2: #edf2ee;       /* inset fields, hover */
  --line: #d2dcd5;          /* hairlines */
  --ink: #17201c;           /* primary text */
  --ink-2: #4b5952;         /* secondary text */
  --ink-3: #5e6b65;         /* tertiary */
  --accent: #1d6b54;        /* maker green: active tool, primary action */
  --accent-ink: #ffffff;
  --accent-soft: #dcede5;
  --ok: #1d6b45; --ok-soft: #ddf0e4;
  --warn: #8a5300; --warn-soft: #f8ecd4;
  --bad: #b3261e; --bad-soft: #fbe3e1;
  --sel: #c2186b;           /* proofing magenta: what you are editing */
  --shadow: 0 1px 2px rgba(10, 30, 20, .12), 0 6px 20px rgba(10, 30, 20, .14);
  --page-shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 10px 28px rgba(0, 0, 0, .28);
  --font-ui: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-mark: "Atkinson Hyperlegible Next", system-ui, sans-serif;
  --r: 7px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #19372e; --grid: rgba(255, 255, 255, .04); --grid-major: rgba(255, 255, 255, .08);
    --panel: #141a17; --panel-2: #1d2621; --line: #2b3832;
    --ink: #e6ede9; --ink-2: #a9b8b0; --ink-3: #93a29a;
    --accent: #5cc29c; --accent-ink: #08140f; --accent-soft: #1d3a2f;
    --ok: #6fcf97; --ok-soft: #173326; --warn: #f0b860; --warn-soft: #3a2c14; --bad: #f28b82; --bad-soft: #3c1d1b;
    --sel: #ff6fae; --shadow: 0 1px 2px rgba(0,0,0,.45), 0 6px 22px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #19372e; --grid: rgba(255, 255, 255, .04); --grid-major: rgba(255, 255, 255, .08);
  --panel: #141a17; --panel-2: #1d2621; --line: #2b3832;
  --ink: #e6ede9; --ink-2: #a9b8b0; --ink-3: #93a29a;
  --accent: #5cc29c; --accent-ink: #08140f; --accent-soft: #1d3a2f;
  --ok: #6fcf97; --ok-soft: #173326; --warn: #f0b860; --warn-soft: #3a2c14; --bad: #f28b82; --bad-soft: #3c1d1b;
  --sel: #ff6fae; --shadow: 0 1px 2px rgba(0,0,0,.45), 0 6px 22px rgba(0,0,0,.4);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--desk); color: var(--ink); font-family: var(--font-ui); font-size: 14.5px; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

#app { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); height: 100%; }

/* ---- top bar */
.topbar {
  display: flex; align-items: center; gap: 10px; min-height: 48px; min-width: 0;
  padding-block: 6px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line); position: relative; z-index: 5;
}
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-mark); font-weight: 800; font-size: 18px; letter-spacing: -.02em; white-space: nowrap; color: var(--ink); }
.brand svg { width: 28px; height: 28px; flex: none; display: block; }
.file { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; max-width: 360px; }
.file-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-meta { color: var(--ink-2); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 99px; font-size: 11px; font-weight: 500; background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line); }
.chip.sample { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.spacer { flex: 1 1 0; }
.group { display: flex; align-items: center; gap: 2px; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 4px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; min-width: 32px; padding: 0 8px;
  border: 1px solid transparent; border-radius: var(--r); background: transparent; color: var(--ink); white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--panel-2); }
.btn:disabled { color: var(--ink-3); cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 500; padding: 0 12px; }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn.outline { border-color: var(--line); background: var(--panel); }
.btn.danger { color: var(--bad); }
.btn svg { width: 18px; height: 18px; flex: none; }
/* icons: a line drawing with a soft tint of the same colour in the main shape */
svg .f { fill: currentColor; fill-opacity: .16; stroke: none; }
.tool[aria-pressed="true"] svg .f { fill-opacity: .3; }
.zoom-val { min-width: 52px; text-align: center; font-family: var(--font-num); font-size: 12px; border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--r); height: 28px; padding: 0 4px; }
.page-nav { display: flex; align-items: center; gap: 4px; color: var(--ink-2); }
.page-nav input { width: 44px; height: 28px; text-align: center; border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--r); font-family: var(--font-num); }

/* ---- tool rail */
.toolbar {
  display: flex; align-items: center; gap: 4px; padding-block: 5px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; position: relative; z-index: 4;
}
.tool {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 70px; padding: 6px 8px; border-radius: 8px;
  border: 1px solid transparent; background: transparent; color: var(--ink); white-space: nowrap; flex: none;
}
.tool:hover { background: var(--panel-2); }
.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.tool svg { width: 23px; height: 23px; }
.tool .lbl { font-size: 13px; font-weight: 500; }
.tool .caret { font-size: 9px; color: var(--ink-3); margin-left: 2px; }
.tool kbd { font-family: var(--font-num); font-size: 10px; color: var(--ink-3); }
.tool-sep { width: 1px; height: 40px; background: var(--line); margin: 0 4px; flex: none; }

/* ---- workspace */
.workspace { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; min-height: 0; position: relative; }
.viewer { touch-action: pan-x pan-y; }
.viewer.draw-tool { touch-action: none; }
.obj, .objsvg .hit, .objsvg .hitfill, .handle, .tgrip { touch-action: none; }
.sidebar { width: 226px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.sidebar[hidden] { display: none !important; }
.side-head { display: flex; align-items: center; gap: 2px; padding: 6px 6px 6px 12px; border-bottom: 1px solid var(--line); }
.side-head h2 { font-size: 14px; font-weight: 700; color: var(--ink); margin: 0; flex: 1; }
.side-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); }
.side-actions .btn { height: 34px; justify-content: flex-start; padding: 0 7px; gap: 6px; font-size: 13px; border-color: var(--line); background: var(--panel); }
.side-actions .btn svg { width: 16px; height: 16px; }
.side-actions .lbl { overflow: hidden; text-overflow: ellipsis; }
.side-hint { padding: 0 12px 6px; color: var(--ink-3); font-size: 12px; line-height: 1.4; }

/* ---- options bar: what to do next + controls for the current thing */
.ctxbar {
  display: flex; align-items: center; flex-wrap: nowrap; gap: 12px; height: 60px; box-sizing: border-box; padding-block: 6px; overflow: hidden;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  background: var(--panel-2); border-bottom: 1px solid var(--line); position: relative; z-index: 3;
}
.ctx-hint { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 500; color: var(--ink); flex: 0 1 auto; min-width: 170px; max-width: 44%; line-height: 1.3; }
.ctx-hint span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ctx-hint svg { width: 20px; height: 20px; color: var(--accent); flex: none; }
.ctx-controls { display: flex; align-items: center; flex-wrap: nowrap; gap: 10px; flex: 1 1 auto; min-width: 0; overflow-x: auto; padding-block: 3px; scrollbar-width: thin; }
.ctx-controls > * { flex: none; }
.ctx-group { display: flex; align-items: center; gap: 7px; }

<div id="app">
  <header class="topbar">
    <div class="brand"><svg viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="var(--accent)"/><path d="M8.5 5.5h7.6l4.4 4.4v11.6a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1Z" fill="#fff"/><path d="M16.1 5.5v4.4h4.4" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-linejoin="round"/><path d="M10.2 12.6h5.4M10.2 18.6h4" stroke="#9db4aa" stroke-width="1.6" stroke-linecap="round"/><path d="M10.2 15.6h7.6" stroke="#c2186b" stroke-width="2" stroke-linecap="round"/></svg><span>Pagewright</span></div>
    <button class="btn" id="btnSidebar" title="Show or hide the list of pages" aria-pressed="true"><span class="hide-sm">Pages</span></button>
    <div class="file">
      <div class="file-name" id="fileName">Loading…</div>
      <div class="file-meta" id="fileMeta"></div>
    </div>
    <button class="btn outline" id="btnOpen" title="Open PDF (Ctrl+O)"><span data-ico="open"></span><span class="hide-xs">Open</span></button>
    <input type="file" id="fileInput" accept="application/pdf,.pdf,image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" hidden>
    <input type="file" id="insertInput" accept="application/pdf,.pdf" hidden>
    <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
    <div class="spacer"></div>
    <div class="group hide-sm page-nav">
      <input id="pageInput" type="text" inputmode="numeric" aria-label="Current page" value="1">
      <span>/ <span id="pageCount" class="num">1</span></span>
    </div>
    <div class="sep hide-sm"></div>
    <div class="group hide-xs">
      <button class="btn" id="btnZoomOut" title="Zoom out (Ctrl −)"></button>
      <button class="zoom-val" id="zoomVal" title="Fit width">100%</button>
      <button class="btn" id="btnZoomIn" title="Zoom in (Ctrl +)"></button>
      <button class="btn hide-sm" id="btnFit" title="Fit page"></button>
    </div>
    <div class="sep hide-xs"></div>
    <div class="searchbar" id="searchBar" hidden>
      <input id="searchInput" type="search" placeholder="Find in document" aria-label="Find in document">
      <span class="cnt" id="searchCount"></span>
      <button class="btn" id="btnSearchPrev" title="Previous match"></button>
      <button class="btn" id="btnSearchNext" title="Next match"></button>
      <button class="btn" id="btnReplaceToggle" title="Replace text" aria-pressed="false">Replace</button>
      <span id="replaceBox" hidden class="group">
        <input id="replaceInput" type="text" placeholder="Replace with" aria-label="Replace with">
        <button class="btn outline" id="btnReplaceAll">Replace all</button>
      </span>
    </div>
    <button class="btn" id="btnSearch" title="Find (Ctrl+F)"></button>
    <div class="group">
      <button class="btn" id="btnUndo" title="Undo your last change (Ctrl+Z)" disabled><span class="hide-sm">Undo</span></button>
      <button class="btn hide-xs" id="btnRedo" title="Redo (Ctrl+Shift+Z)" disabled><span class="hide-sm">Redo</span></button>
    </div>
    <button class="btn primary" id="btnSave" title="Download the edited PDF (Ctrl+S)"><span data-ico="download"></span><span class="hide-xs">Download</span></button>
    <button class="btn" id="btnHelp" title="How to use Pagewright"><span data-ico="help"></span><span class="hide-sm">Help</span></button>
    <button class="btn hide-xs" id="btnInspector" title="Show document details" aria-pressed="false"><span class="hide-sm">Details</span></button>
  </header>

  <nav class="toolbar" id="toolbar" aria-label="Tools"></nav>
  <div class="ctxbar" id="ctxbar" role="region" aria-label="Options" aria-live="polite"></div>

  <div class="workspace">
    <aside class="sidebar" id="sidebar" aria-label="Pages">
      <div class="side-head"><h2>Pages</h2><span class="chip num" id="selCount" hidden></span></div>
      <div class="side-actions">
        <button class="btn" id="pgRotL" title="Turn the page to the left"><span class="lbl">Turn left</span></button>
        <button class="btn" id="pgRotR" title="Turn the page to the right"><span class="lbl">Turn right</span></button>
        <button class="btn" id="pgUp" title="Move the page up"><span class="lbl">Move up</span></button>
        <button class="btn" id="pgDown" title="Move the page down"><span class="lbl">Move down</span></button>
        <button class="btn" id="pgBlank" title="Add an empty page after this one"><span class="lbl">Blank page</span></button>
        <button class="btn" id="pgInsert" title="Add pages from another PDF file"><span class="lbl">Add PDF</span></button>
        <button class="btn" id="pgExtract" title="Save the chosen pages as their own PDF"><span class="lbl">Save pages</span></button>
        <button class="btn danger" id="pgDelete" title="Delete the chosen pages"><span class="lbl">Delete</span></button>
      </div>
      <div class="side-hint">Click a page to choose it. Hold Ctrl or Shift to choose several. Drag pages to reorder.</div>
      <div class="thumbs" id="thumbs"></div>
    </aside>
    <section class="viewer" id="viewer" tabindex="0" aria-label="Document" role="main">
      <div class="pages" id="pages"></div>
    </section>
    <aside class="inspector" id="inspector" aria-label="Inspector"></aside>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="vendor/pdf-lib.min.js"></script>
<script type="module" src="app/main.js"></script>

</html>
