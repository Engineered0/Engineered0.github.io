<header class="top">
  <button class="brand" id="homeBtn" aria-label="Open job board">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" fill="var(--optic)"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="var(--optic-ink)" stroke-width="2.4"/><circle cx="16" cy="16" r="3.4" fill="var(--optic-ink)"/><path d="M16 1v5M16 26v5M1 16h5M26 16h5" stroke="var(--optic-ink)" stroke-width="2"/></svg>
    <h1>Vision Bench</h1>
  </button>
  <div class="jobline" id="jobline"></div>
  <div class="rank" id="rank"></div>
  <button class="iconbtn" id="helpBtn" aria-label="Help and keyboard shortcuts" title="Help">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.3a2.8 2.8 0 1 1 3.4 3.3v1.6"/><circle cx="12.3" cy="17.4" r="1.05" fill="currentColor" stroke="none"/></svg>
  </button>
  <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark theme" title="Theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
  </button>
</header>

<main class="ws">
  <aside class="col controls" id="controls" aria-label="Setup controls"></aside>

  <section class="benchcol" aria-label="3D bench">
    <div class="benchbar">
      <button class="btn" id="viewIso">Bench view</button>
      <button class="btn" id="viewTop">Top view</button>
      <button class="btn" id="viewSide">Side view</button>
      <span class="spacer"></span>
      <label class="tog" style="gap:6px;font-size:13px"><span>Light paths</span><input type="checkbox" id="beamsTog" checked></label>
      <label class="tog" style="gap:6px;font-size:13px"><span>Run conveyor</span><input type="checkbox" id="runTog" checked></label>
    </div>
    <div class="stage3d" id="stage3d">
      <div class="stage-msg hide" id="stageMsg"></div>
      <div class="armed-tip hide" id="armedTip"></div>
      <div class="legend3d"><span><i></i>Camera field of view</span><span>Drag to orbit, scroll to zoom</span></div>
      <div class="flash" id="flash3d"></div>
    </div>
    <div class="brief" id="brief"></div>
  </section>

  <aside class="col inspect" aria-label="Camera image and results">
    <div class="sensorwrap">
      <div class="sensorhead"><h2>Camera image</h2><span class="meta" id="sensorMeta"></span></div>
      <div class="sensorbox" id="sensorBox">
        <canvas id="sensor" width="720" height="540" aria-label="Simulated camera image"></canvas>
        <div class="loupe hide" id="loupe"><canvas id="loupeCv" width="144" height="144"></canvas><span id="loupeTxt"></span></div>
        <div class="flash" id="flashS"></div>
      </div>
      <div class="sensortools">
        <label class="tog"><span>Mark defects</span><input type="checkbox" id="overlayTog" checked></label>
        <label class="tog"><span>Pixel loupe</span><input type="checkbox" id="loupeTog" checked></label>
        <label class="tog"><span>Clipping</span><input type="checkbox" id="clipTog"></label>
        <span class="spacer"></span>
        <span class="hint" id="sensorHint"></span>
      </div>
      <div class="histowrap"><canvas id="histo" width="512" height="46" aria-label="Brightness histogram"></canvas><span class="hlabel">Brightness histogram</span></div>
    </div>
    <div class="capture">
      <button class="btn primary big" id="captureBtn">Capture and grade</button>
      <div class="row">
        <button class="btn" id="expertBtn">Show expert setup</button>
        <button class="btn" id="resetBtn">Reset setup</button>
        <button class="btn" id="copyBtn" title="Copy the setup as a text spec">Copy spec</button>
      </div>
      <div class="cost" id="cost"></div>
    </div>
    <div class="live" id="live"></div>
  </aside>
</main>

<nav class="tabbar" id="tabbar" aria-label="Panels">
  <button data-tab="bench" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 18h18M7 18V9h4v9M14 18v-5h4v5"/><circle cx="9" cy="5" r="2"/></svg>Bench</button>
  <button data-tab="image" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>Image</button>
  <button data-tab="setup" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>Setup</button>
</nav>
<div id="modalRoot"></div>
