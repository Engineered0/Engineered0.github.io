<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vision Bench: machine vision setup trainer</title>
<meta name="description" content="Choose lighting, lenses and cameras for real inspection jobs and see whether the defect shows up.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9edf2; --panel:#f7f9fb; --panel2:#ffffff; --sunk:#dde3ea; --line:#c9d2dd; --line2:#b3bfcd;
  --ink:#16202e; --ink2:#3a4a60; --mute:#6a7a8f;
  --optic:#0f8f98; --optic-ink:#ffffff; --optic-soft:rgba(15,143,152,.12);
  --pass:#1d9a5a; --warn:#c07a0c; --fail:#cf3a3f;
  --scene-bg:#dfe5ec; --scene-grid:#c3ccd7;
  --shadow:0 1px 0 rgba(22,32,46,.05),0 8px 24px -12px rgba(22,32,46,.25);
  --r-s:4px; --r-m:8px; --r-l:14px;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-c:"Barlow Condensed","Barlow",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141b26; --panel:#1b2432; --panel2:#212c3c; --sunk:#111823; --line:#2c3a4e; --line2:#3a4b63;
    --ink:#e6ecf4; --ink2:#b6c2d3; --mute:#8595ab;
    --optic:#3fc1c9; --optic-ink:#08212a; --optic-soft:rgba(63,193,201,.14);
    --pass:#3ccf85; --warn:#f0ad3c; --fail:#ff6166;
    --scene-bg:#101722; --scene-grid:#223044;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141b26; --panel:#1b2432; --panel2:#212c3c; --sunk:#111823; --line:#2c3a4e; --line2:#3a4b63;
  --ink:#e6ecf4; --ink2:#b6c2d3; --mute:#8595ab;
  --optic:#3fc1c9; --optic-ink:#08212a; --optic-soft:rgba(63,193,201,.14);
  --pass:#3ccf85; --warn:#f0ad3c; --fail:#ff6166;
  --scene-bg:#101722; --scene-grid:#223044;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--optic);outline-offset:2px}
img,canvas,svg{max-width:100%}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.15}
p{margin:0}
.hide{display:none!important}

/* ---------- top bar ---------- */
.top{height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand-mark{width:30px;height:30px}
.brand h1{font-family:var(--font-c);font-size:24px;font-weight:600;letter-spacing:.01em}
.jobline{flex:1;min-width:0;display:flex;align-items:center;gap:10px;overflow:hidden}
.jobline .jt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jobline .jc{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank{display:flex;align-items:center;gap:8px;color:var(--ink2);white-space:nowrap}
.rank b{font-family:var(--font-c);font-size:20px;color:var(--ink)}
.iconbtn{width:36px;height:36px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r-m);border:1px solid var(--line2);background:var(--panel2);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--optic)}
.btn.primary{background:var(--optic);border-color:var(--optic);color:var(--optic-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{height:46px;padding:0 20px;font-size:17px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{border-color:var(--line2)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- workstation grid ---------- */
.ws{display:grid;grid-template-columns:320px minmax(0,1fr) 440px;height:calc(100vh - 56px);height:calc(100dvh - 56px)}
.col{min-height:0;overflow:auto}
.controls{border-right:1px solid var(--line);background:var(--panel)}
.inspect{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.benchcol{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.brief{flex:none;max-height:40%;overflow:auto}

/* ---------- controls ---------- */
.sec{border-bottom:1px solid var(--line)}
.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary h2{font-size:16px;flex:1}
.sec>summary .sum{color:var(--mute);font-size:13px;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec>summary .chev{width:14px;height:14px;transition:transform .15s;color:var(--mute)}
.sec[open]>summary .chev{transform:rotate(90deg)}
.sec .body{padding:2px 16px 16px;display:grid;gap:12px}
.field{display:grid;gap:5px}
.field>label,.lbl{font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.field>label output,.lbl output{color:var(--ink);font-weight:600}
.sel{height:36px;border-radius:var(--r-s);border:1px solid var(--line2);background:var(--panel2);padding:0 8px;width:100%}
input[type=range]{width:100%;accent-color:var(--optic);height:22px;margin:0}
input[type=color]{width:36px;height:30px;border:1px solid var(--line2);border-radius:var(--r-s);padding:1px;background:var(--panel2)}
.row{display:flex;gap:8px;align-items:center}
.row>.grow{flex:1;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line2);background:var(--panel2);border-radius:var(--r-m);padding:7px 4px 6px;display:grid;justify-items:center;gap:3px;font-size:12.5px;line-height:1.1}
.seg button svg{width:34px;height:24px;color:var(--ink2)}
.seg button[aria-pressed=true]{border-color:var(--optic);background:var(--optic-soft);box-shadow:inset 0 0 0 1px var(--optic)}
.seg button[aria-pressed=true] svg{color:var(--optic)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:99px;padding:4px 10px 4px 6px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.chip i{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.chip[aria-pressed=true]{border-color:var(--optic);box-shadow:inset 0 0 0 1px var(--optic);background:var(--optic-soft)}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.swatches button{width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);padding:0}
.swatches button[aria-pressed=true]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--optic)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;cursor:pointer}
.tog small{display:block;color:var(--mute);font-size:12px;line-height:1.3}
.tog input{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--sunk);border:1px solid var(--line2);position:relative;flex:none;cursor:pointer;margin:0}
.tog input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--mute);transition:transform .15s,background .15s}
.tog input:checked{background:var(--optic-soft);border-color:var(--optic)}
.tog input:checked::after{transform:translateX(16px);background:var(--optic)}
.tog input:disabled{opacity:.4}
.hint{font-size:13px;color:var(--mute);line-height:1.4}
.readout{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px;background:var(--sunk);border-radius:var(--r-m);padding:10px 12px}
.readout dt{color:var(--ink2)}
.readout dd{margin:0;text-align:right;font-weight:600}
.readout .bad{color:var(--fail)} .readout .meh{color:var(--warn)} .readout .ok{color:var(--pass)}
.locked-note{font-size:13px;color:var(--mute);background:var(--sunk);border-radius:var(--r-m);padding:8px 10px}

/* defect palette */
.dpal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dpal button{border:1px solid var(--line2);background:var(--panel2);border-radius:var(--r-m);padding:6px 8px;text-align:left;font-size:13px;display:flex;gap:7px;align-items:center}
.dpal button svg{width:20px;height:20px;flex:none;color:var(--ink2)}
.dpal button[aria-pressed=true]{border-color:var(--optic);box-shadow:inset 0 0 0 1px var(--optic);background:var(--optic-soft)}
.dlist{display:grid;gap:6px}
.ditem{border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel2)}
.ditem>button.dh{width:100%;display:flex;align-items:center;gap:8px;padding:7px 10px;background:none;border:0;text-align:left;font-size:14px}
.ditem .dot{width:9px;height:9px;border-radius:50%;background:var(--mute);flex:none}
.ditem .dot.pass{background:var(--pass)} .ditem .dot.marginal{background:var(--warn)} .ditem .dot.miss{background:var(--fail)}
.ditem .dsz{margin-left:auto;color:var(--mute);font-size:12.5px}
.ditem.on{border-color:var(--optic)}
.ditem .dbody{padding:0 10px 10px;display:grid;gap:8px}

/* ---------- bench (3D) ---------- */
.benchbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.benchbar .spacer{flex:1}
.stage3d{position:relative;flex:1;min-height:280px;background:var(--scene-bg);overflow:hidden;touch-action:none}
.stage3d canvas{display:block;width:100%;height:100%}
.stage-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--mute)}
.armed-tip{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--optic);border-radius:99px;padding:6px 14px;font-size:14px;box-shadow:var(--shadow);white-space:nowrap;pointer-events:none}
.legend3d{position:absolute;left:12px;bottom:10px;display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--ink2);pointer-events:none}
.legend3d span{display:inline-flex;align-items:center;gap:5px}
.legend3d i{width:14px;height:2px;background:var(--optic);display:inline-block}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:screen}
.flash.go{animation:flash .35s ease-out}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}
.brief{padding:12px 16px;border-top:1px solid var(--line);background:var(--panel);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:start}
.brief p{max-width:78ch;color:var(--ink2)}
.brief .facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--mute);grid-column:1/-1}
.brief .facts b{color:var(--ink);font-weight:600}

/* ---------- inspect ---------- */
.sensorwrap{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.sensorhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sensorhead h2{font-size:16px;flex:1}
.sensorhead .meta{font-size:12.5px;color:var(--mute)}
.sensorbox{position:relative;border-radius:var(--r-s);overflow:hidden;background:#000;border:1px solid var(--line2);cursor:crosshair}
.sensorbox canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.sensorbox.armed{box-shadow:0 0 0 2px var(--optic)}
.loupe{position:absolute;width:150px;height:150px;border-radius:50%;border:2px solid var(--optic);overflow:hidden;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.5);background:#000}
.loupe canvas{width:100%;height:100%;image-rendering:pixelated}
.loupe span{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:#fff;text-shadow:0 1px 2px #000}
.sensortools{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.sensortools .tog{font-size:13px;gap:6px}
.sensortools .spacer{flex:1}
.capture{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.capture .btn.big{width:100%}
.capture .row .btn{flex:1}
.cost{display:grid;gap:4px;font-size:13.5px}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--optic);border-radius:99px;transition:width .25s}
.bar.over>i{background:var(--fail)}
.live{padding:12px 14px;display:grid;gap:10px}
.live h3{font-size:15px}
.scorebig{display:flex;align-items:baseline;gap:10px}
.scorebig b{font-family:var(--font-c);font-size:44px;line-height:1}
.issues{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.issues li{display:grid;grid-template-columns:10px 1fr;gap:8px;font-size:13.5px;line-height:1.4;color:var(--ink2)}
.issues li::before{content:"";width:8px;height:8px;border-radius:2px;margin-top:6px;background:var(--mute)}
.issues li.fail::before{background:var(--fail)} .issues li.warn::before{background:var(--warn)} .issues li.info::before{background:var(--optic)}
.empty{color:var(--mute);font-size:13.5px}

/* ---------- stars ---------- */
.stars{display:inline-flex;gap:2px}
.stars svg{width:18px;height:18px}
.stars .on{color:#f1b52c} .stars .off{color:var(--line2)}
.stars.lg svg{width:40px;height:40px}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.62);display:grid;place-items:center;padding:20px;z-index:50;backdrop-filter:blur(3px)}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-l);box-shadow:var(--shadow);width:min(720px,100%);max-height:calc(100dvh - 40px);overflow:auto}
.modal.wide{width:min(1060px,100%)}
.mhead{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.mhead h2{font-family:var(--font-c);font-size:28px;font-weight:600}
.mhead p{color:var(--mute);margin-top:2px}
.mhead .grow{flex:1;min-width:0}
.mbody{padding:18px 20px 22px;display:grid;gap:18px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel);flex-wrap:wrap}

/* home */
.home{width:min(1120px,100%)}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;padding:28px 28px 8px;align-items:center}
.hero h2{font-family:var(--font-c);font-size:52px;line-height:.98;font-weight:600;letter-spacing:-.01em}
.hero p{color:var(--ink2);font-size:17px;margin-top:14px;max-width:52ch}
.hero .cta{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.hero-art{aspect-ratio:4/3;border-radius:var(--r-l);overflow:hidden;background:#000;position:relative;border:1px solid var(--line2)}
.hero-art canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.hero-art .tag{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:4px 9px;border-radius:99px}
.jobs-head{display:flex;align-items:center;gap:12px;padding:20px 28px 6px;flex-wrap:wrap}
.jobs-head h3{font-size:20px;flex:1}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:10px 28px 28px}
.job{border:1px solid var(--line2);background:var(--panel2);border-radius:var(--r-m);padding:14px;text-align:left;display:grid;gap:6px;position:relative;align-content:start}
.job:hover:not(:disabled){border-color:var(--optic)}
.job .n{font-family:var(--font-c);font-size:15px;color:var(--mute)}
.job h4{font-size:18px}
.job .cl{color:var(--ink2);font-size:14px}
.job .jf{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px;color:var(--mute)}
.job:disabled{opacity:.5}
.job .lock{position:absolute;top:12px;right:12px;width:16px;height:16px;color:var(--mute)}
.job .assist{font-size:12px;color:var(--warn)}
.diff{display:inline-flex;gap:3px}
.diff i{width:6px;height:10px;border-radius:1px;background:var(--line2)}
.diff i.on{background:var(--ink2)}

/* results */
.result-top{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.gauge{width:150px;height:150px;position:relative}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-c);font-size:48px}
.verdict h3{font-family:var(--font-c);font-size:30px;font-weight:600}
.verdict p{color:var(--ink2);margin-top:6px;max-width:56ch}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:500;color:var(--mute);padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.num,table.t th.num{text-align:right}
.tag-v{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12.5px;font-weight:600}
.tag-v.pass{background:color-mix(in srgb,var(--pass) 18%,transparent);color:var(--pass)}
.tag-v.marginal{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag-v.miss{background:color-mix(in srgb,var(--fail) 18%,transparent);color:var(--fail)}
.scroll-x{overflow-x:auto}

/* expert */
.xgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px}
.xsum{display:flex;flex-wrap:wrap;gap:6px}
.xsum span{background:var(--optic-soft);border:1px solid color-mix(in srgb,var(--optic) 40%,transparent);border-radius:99px;padding:3px 10px;font-size:13.5px}
.why{display:grid;gap:16px;align-content:start}
.why h4{font-size:16px;margin-bottom:3px}
.why p{color:var(--ink2);max-width:70ch}
.cmp{display:grid;gap:7px}
.cmp .r{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;font-size:13.5px}
.cmp .r .bar{height:10px}
.cmp .r.best .bar>i{background:var(--pass)}
.cmp .r small{color:var(--mute)}
.box{border:1px solid var(--line);border-radius:var(--r-m);padding:14px;display:grid;gap:10px;background:var(--panel2)}
.box h4{font-size:15px}
.delta{margin:0;padding-left:18px;display:grid;gap:4px;color:var(--ink2);font-size:14px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--optic);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:80;box-shadow:var(--shadow)}

/* ---------- responsive ---------- */
@media (max-width:1280px){ .ws{grid-template-columns:290px minmax(0,1fr) 380px} }
@media (max-width:1060px){
  .ws{grid-template-columns:1fr;height:auto}
  .col{overflow:visible}
  .benchcol{order:1} .inspect{order:2;border-left:0;border-top:1px solid var(--line)} .controls{order:3;border-right:0;border-top:1px solid var(--line)}
  .stage3d{height:52vh;flex:none}
  .hero{grid-template-columns:1fr}
  .xgrid{grid-template-columns:1fr}
  .jobline .jc{display:none}
}
@media (max-width:620px){
  .rank span.t{display:none}
  .brand h1{font-size:20px}
  .hero{padding:20px 18px 4px} .hero h2{font-size:38px}
  .jobs,.jobs-head{padding-left:18px;padding-right:18px}
  .result-top{grid-template-columns:1fr;justify-items:start}
  .mhead,.mbody,.mfoot{padding-left:14px;padding-right:14px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ================= polish pass ================= */
:root{--ease:cubic-bezier(.2,.8,.25,1)}
.btn{transition:border-color .16s var(--ease),background .16s var(--ease),transform .12s var(--ease),box-shadow .16s var(--ease)}
.btn:active{transform:translateY(1px)}
.btn.primary{box-shadow:0 2px 10px -4px color-mix(in srgb,var(--optic) 70%,transparent)}

.iconbtn{transition:border-color .16s var(--ease),color .16s var(--ease)}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.scrim{animation:fadeIn .18s var(--ease)}
.modal{animation:fadeUp .3s var(--ease)}
.toast{animation:slideUp .22s var(--ease)}
.toast.hide{opacity:0;transform:translate(-50%,10px);transition:opacity .25s,transform .25s}
.stars.lg svg{animation:pop .45s var(--ease) backwards}
.stars.lg span:nth-child(2) svg{animation-delay:.12s}
.stars.lg span:nth-child(3) svg{animation-delay:.24s}
.live,.capture{animation:fadeIn .25s var(--ease)}

.histowrap{position:relative;margin-top:8px}
.histowrap canvas{display:block;width:100%;height:46px;border-radius:var(--r-s);background:var(--sunk)}
.histowrap .hlabel{position:absolute;left:8px;top:4px;font-size:11.5px;color:var(--mute);pointer-events:none}

/* tab bar (small screens) */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));grid-template-columns:repeat(3,1fr);gap:4px}

.coach-on{position:relative;z-index:61;box-shadow:0 0 0 3px var(--optic),0 0 0 9px color-mix(in srgb,var(--optic) 25%,transparent);border-radius:var(--r-m);animation:fadeIn .2s}

/* ---------- auto exposure ---------- */

  function drawTexture(ctx,S,X,E,view){
    const M=X.M,P=X.P,amp=X.clutter*2.2;
    if(amp*255<.6||S.material==='clear')return;
    const pl=vmax(vclip(E.partV));
    const rng=mulberry32(hashStr(S.part+'|'+S.material));
    const R=()=>(rng()*2-1)*amp*1.7;
    const hw=P.w/2,hh=P.h/2;
    // visible window in mm (skip strokes outside, keeps the loupe fast)
    const vx0=view.cx-view.w/2/view.s,vx1=view.cx+view.w/2/view.s,vy0=view.cy-view.h/2/view.s,vy1=view.cy+view.h/2/view.s;
    ctx.save();
    if(S.material==='brushed'){
      ctx.lineWidth=.05;
      for(let y=-hh;y<=hh;y+=.055){const b=R();if(y<vy0-.1||y>vy1+.1)continue;ctx.strokeStyle=texStroke(ctx,b,pl);ctx.beginPath();ctx.moveTo(-hw,y);ctx.lineTo(hw,y);ctx.stroke();}
    }else if(S.material==='machined'){
      ctx.lineWidth=.06;
      const round=P.shape!=='rect';const c=round?[0,0]:[-P.w*.9,P.h*.1];
      const r0=round?(P.shape==='ring'?P.inner:0):Math.hypot(hw+P.w*.9-P.w,hh)*.2;
      const r1=round?hw:Math.hypot(P.w*1.4,hh*1.4);
      for(let r=Math.max(r0,.2);r<=r1;r+=.08){const b=R()*.8;ctx.strokeStyle=texStroke(ctx,b,pl);ctx.beginPath();ctx.arc(c[0],c[1],r,0,Math.PI*2);ctx.stroke();}
    }else if(S.material==='paper'){
      const n=Math.min(9000,P.w*P.h*1.4|0);ctx.lineWidth=.06;
      for(let i=0;i<n;i++){const x=(rng()-.5)*P.w,y=(rng()-.5)*P.h,a=rng()*Math.PI,l=.3+rng()*.8,b=R();if(x<vx0-1||x>vx1+1||y<vy0-1||y>vy1+1)continue;ctx.strokeStyle=texStroke(ctx,b,pl);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);ctx.stroke();}
    }else{
      const n=Math.min(14000,P.w*P.h*(P.shape==='rect'?2.4:3)|0);
      for(let i=0;i<n;i++){const x=(rng()-.5)*P.w,y=(rng()-.5)*P.h,r=.04+rng()*.1,b=R();if(x<vx0-1||x>vx1+1||y<vy0-1||y>vy1+1)continue;ctx.fillStyle=texStroke(ctx,b,pl);ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();}
    }
    ctx.restore();
  }

  function blobPath(ctx,rng,a,b){
    const n=11,pts=[];
    for(let i=0;i<n;i++){const t=i/n*Math.PI*2,k=.72+rng()*.38;pts.push([Math.cos(t)*a*k,Math.sin(t)*b*k]);}
    ctx.beginPath();
    for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n],m=[(p[0]+q[0])/2,(p[1]+q[1])/2];if(i===0){const z=pts[n-1];ctx.moveTo((z[0]+p[0])/2,(z[1]+p[1])/2);}ctx.quadraticCurveTo(p[0],p[1],m[0],m[1]);}
    ctx.closePath();
  }

  function drawDefect(ctx,S,x,i){
    const d=x.d,D=x.D,G=x.G,lv=vclip(x.drawV);
    const rng=mulberry32(hashStr(d.type)+i*7919+Math.round(d.u*1000)*31+Math.round(d.v*1000));
    const col=css(lv);
    ctx.save();
    if(D.kind==='edge'){
      const a=G.a,ang=Math.atan2(a.ny,a.nx);
      if(d.type==='chip'){ctx.translate(a.x,a.y);ctx.rotate(ang);ctx.fillStyle=col;blobPath(ctx,rng,G.w,G.l/2);ctx.fill();}
      else{ctx.translate(a.x+a.nx*G.w*.45,a.y+a.ny*G.w*.45);ctx.rotate(ang);ctx.fillStyle=col;blobPath(ctx,rng,G.w*.55,G.l/2);ctx.fill();}
      ctx.restore();return;
    }
    if(D.kind==='feature'){ctx.restore();return;}
    ctx.translate(G.x,G.y);ctx.rotate((d.ang||0)*Math.PI/180);
    const w=G.w,l=G.l;
    switch(D.shape){
      case 'line':{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';const c=l*.07*(rng()-.5);ctx.beginPath();ctx.moveTo(-l/2,0);ctx.quadraticCurveTo(0,c,l/2,c*.3);ctx.stroke();break;}
      case 'crack':{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();const n=12;let br=null;
        for(let k=0;k<=n;k++){const px=-l/2+l*k/n,py=(k&&k<n)?(rng()-.5)*l*.09:0;k?ctx.lineTo(px,py):ctx.moveTo(px,py);if(k===5)br=[px,py];}
        ctx.stroke();if(br){ctx.lineWidth=w*.7;ctx.beginPath();ctx.moveTo(br[0],br[1]);ctx.lineTo(br[0]+l*.12,br[1]+l*.14);ctx.lineTo(br[0]+l*.2,br[1]+l*.17);ctx.stroke();}break;}
      case 'dent':{const g=ctx.createRadialGradient(0,0,0,0,0,w/2);g.addColorStop(0,css(lv,.95));g.addColorStop(.55,css(lv,.75));g.addColorStop(1,css(lv,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,w/2,0,6.2832);ctx.fill();break;}
      case 'blob':{ctx.fillStyle=css(lv,.45);blobPath(ctx,rng,w/2*1.08,l/2*1.08);ctx.fill();ctx.fillStyle=css(lv,.92);blobPath(ctx,mulberry32(hashStr(d.type)+i),w/2*.92,l/2*.92);ctx.fill();break;}
      case 'dot':{ctx.fillStyle=col;blobPath(ctx,rng,w/2,w/2);ctx.fill();break;}
      case 'bubble':{ctx.strokeStyle=col;ctx.lineWidth=Math.max(w*.2,.01);ctx.beginPath();ctx.arc(0,0,w/2*.9,0,6.2832);ctx.stroke();ctx.fillStyle=css(lv,.25);ctx.beginPath();ctx.arc(0,0,w/2*.8,0,6.2832);ctx.fill();break;}
      case 'smear':{ctx.strokeStyle=css(lv,.9);ctx.lineCap='round';ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(-l/2,0);ctx.bezierCurveTo(-l/6,w*.8,l/6,-w*.6,l/2,w*.3);ctx.stroke();ctx.lineWidth=w*.5;ctx.strokeStyle=css(lv,.6);ctx.beginPath();ctx.moveTo(-l/2+w,w*.6);ctx.lineTo(l/3,w*.9);ctx.stroke();break;}
    }
    ctx.restore();
  }

  function drawFeatures(ctx,S,X,E,miss){
    const P=X.P,K=X.K;
    const topoC=vclip(vadd(E.partV,vsc(X.topoV,K*.4*X.r.topo*X.topoScale)));
    const rimC=vclip(vadd(E.partV,vsc(X.topoV,K*.3*Math.abs(X.r.topo)*X.topoScale)));
    ctx.save();
    for(const f of(P.feats||[])){
      ctx.strokeStyle=css(topoC);
      if(f.k==='ring'){ctx.lineWidth=.6;ctx.beginPath();ctx.arc(0,0,f.r,0,6.2832);ctx.stroke();}
      else if(f.k==='ticks'){ctx.lineWidth=.35;ctx.beginPath();for(let k=0;k<48;k++){const a=k/48*Math.PI*2;ctx.moveTo(Math.cos(a)*f.r,Math.sin(a)*f.r);ctx.lineTo(Math.cos(a)*(f.r+1.3),Math.sin(a)*(f.r+1.3));}ctx.stroke();}
      else if(f.k==='vent'){ctx.lineWidth=.6;for(let k=0;k<4;k++){ctx.beginPath();ctx.arc(0,0,3.6,k*Math.PI/2+.25,k*Math.PI/2+1.3);ctx.stroke();}}
      else if(f.k==='ribs'){ctx.lineWidth=.9;ctx.beginPath();for(let x=-12;x<=12;x+=6){ctx.moveTo(x,-12);ctx.lineTo(x,12);}ctx.stroke();}
    }
    // hole rims
    ctx.strokeStyle=css(rimC);ctx.lineWidth=.35;
    (P.holes||[]).forEach((h,i)=>{if(miss.has(i))return;ctx.beginPath();ctx.arc(h[0],h[1],h[2]+.15,0,6.2832);ctx.stroke();});
    if(P.shape==='ring'){ctx.beginPath();ctx.arc(0,0,P.inner+.15,0,6.2832);ctx.stroke();}
    // components and print
    const fl=featureList(P);
    fl.forEach((f,i)=>{
      if(f.kind==='comp'){
        const c=f.src;
        if(miss.has(i)){ctx.fillStyle=css(vclip(surfaceV(X,'#c8a060',K)));const pw=Math.min(c.w*.3,1.4);ctx.fillRect(c.x-c.w/2,c.y-c.h/2,pw,c.h);ctx.fillRect(c.x+c.w/2-pw,c.y-c.h/2,pw,c.h);return;}
        ctx.fillStyle=css(vclip(surfaceV(X,c.c,K)));ctx.fillRect(c.x-c.w/2,c.y-c.h/2,c.w,c.h);
        if(c.k==='ic'){ctx.fillStyle=css(vclip(surfaceV(X,'#c0c4c8',K)));for(let k=0;k<6;k++){const y=c.y-c.h/2+1.2+k*(c.h-2.4)/5;ctx.fillRect(c.x-c.w/2-1.1,y-.25,1.1,.5);ctx.fillRect(c.x+c.w/2,y-.25,1.1,.5);}}
        ctx.strokeStyle=css(rimC,.8);ctx.lineWidth=.2;ctx.strokeRect(c.x-c.w/2,c.y-c.h/2,c.w,c.h);
      }else if(f.kind==='print'){
        if(miss.has(i))return;
        const b=f.src,pc=css(vclip(surfaceV(X,PRINT_COLOR,K,.05)));ctx.fillStyle=pc;ctx.strokeStyle=pc;
        const x0=b.x-b.w/2,y0=b.y-b.h/2;const r=mulberry32(hashStr('print'+b.x));
        if(b.bars){let x=x0;while(x<x0+b.w){const bw=.33*(1+Math.floor(r()*3));ctx.fillRect(x,y0,bw,b.h*.82);x+=bw+.33*(1+Math.floor(r()*3));}}
        else if(b.text){let x=x0;while(x<x0+b.w){const cw=1.3+r()*1.2;ctx.fillRect(x,y0,cw,b.h);x+=cw+(r()<.18?1.8:.5);}}
        else if(b.box){ctx.lineWidth=.6;ctx.strokeRect(x0,y0,b.w,b.h);const n=12,cs=(b.h-2)/n;for(let yy=0;yy<n;yy++)for(let xx=0;xx<n;xx++)if(r()<.5)ctx.fillRect(x0+b.w-b.h+1+xx*cs,y0+1+yy*cs,cs,cs);ctx.font='3px sans-serif';ctx.fillText('LOT 2604',x0+1,y0+b.h*.45);}
      }
    });
    ctx.restore();
  }

  function drawScene(ctx,S,E,view){
    const X=E.X,P=X.P,O=E.O,K=X.K,s=view.s;
    const miss=missingSet(S);
    ctx.save();
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle=css(vclip(E.stageV));ctx.fillRect(0,0,view.w,view.h);
    ctx.translate(view.w/2-view.cx*s,view.h/2-view.cy*s);ctx.scale(s,s);
    // part body
    partPath(ctx,P,miss);ctx.fillStyle=css(vclip(E.partV));ctx.fill('evenodd');
    ctx.save();partPath(ctx,P,miss);ctx.clip('evenodd');
    drawTexture(ctx,S,X,E,view);
    ctx.globalCompositeOperation='source-over';
    drawFeatures(ctx,S,X,E,miss);
    ctx.restore();
    // defects
    E.defs.forEach((x,i)=>{if(x.D.kind==='surface')drawDefect(ctx,S,x,i);});
    // illumination falloff and glare, inside the part (plus edge defects)
    ctx.save();partPath(ctx,P,miss);ctx.clip('evenodd');
    if(X.unif<.999&&!X.back){
      ctx.save();ctx.scale(P.w/2,P.h/2);ctx.globalCompositeOperation='multiply';
      const g=ctx.createRadialGradient(0,0,0,0,0,1.42);
      for(const t of[0,.25,.5,.75,1]){const v=1-(1-X.unif)*t*t;const c=Math.round(v*255);g.addColorStop(t,`rgb(${c},${c},${c})`);}
      ctx.fillStyle=g;ctx.fillRect(-1.5,-1.5,3,3);ctx.restore();
    }
    const gl=X.r.glare;
    if(gl>0){
      const gv=vsc(X.whiteV,K*gl*1.6);
      ctx.save();ctx.scale(P.w/2,P.h/2);ctx.globalCompositeOperation='lighter';
      let g;
      if(S.tech==='ring'){g=ctx.createRadialGradient(0,0,0,0,0,1.2);[[0,0],[.16,.02],[.29,.37],[.42,1],[.55,.37],[.68,.02],[.8,0],[1.2,0]].forEach(([t,a])=>g.addColorStop(t/1.2,css(gv,a)));}
      else if(S.tech==='bar'){g=ctx.createLinearGradient(0,-1.2,0,1.2);[[-1.2,0],[-.65,.02],[-.4,.37],[-.15,1],[.1,.37],[.35,.02],[1.2,0]].forEach(([y,a])=>g.addColorStop((y+1.2)/2.4,css(gv,a)));}
      else{g=ctx.createRadialGradient(0,0,0,0,0,1);[[0,1],[.2,.72],[.35,.37],[.5,.13],[.7,.02],[1,0]].forEach(([t,a])=>g.addColorStop(t,css(gv,a)));}
      ctx.fillStyle=g;ctx.fillRect(-1.5,-1.5,3,3);ctx.restore();
    }
    ctx.restore();
    // edge defects are drawn after so they are not clipped away
    E.defs.forEach((x,i)=>{if(x.D.kind==='edge')drawDefect(ctx,S,x,i);});
    // vignette (mm space, centred on the optical axis)
    if(O.vignette>0){
      const R=Math.hypot(O.fovW,O.fovH)/2;ctx.globalCompositeOperation='multiply';
      const g=ctx.createRadialGradient(0,0,0,0,0,R);
      for(const t of[0,.25,.5,.75,1]){const v=1-O.vignette*.8*t*t;const c=Math.round(v*255);g.addColorStop(t,`rgb(${c},${c},${c})`);}
      ctx.fillStyle=g;ctx.fillRect(-R*2,-R*2,R*4,R*4);
    }
    ctx.restore();
  }

  /* ---- pixel operations ---- */
  function boxH(src,dst,w,h,r){const div=2*r+1;for(let y=0;y<h;y++){for(let c=0;c<3;c++){let acc=0;const row=y*w;for(let x=-r;x<=r;x++)acc+=src[(row+clamp(x,0,w-1))*4+c];for(let x=0;x<w;x++){dst[(row+x)*4+c]=acc/div;acc+=src[(row+Math.min(x+r+1,w-1))*4+c]-src[(row+Math.max(x-r,0))*4+c];}}}}
  function boxV(src,dst,w,h,r){const div=2*r+1;for(let x=0;x<w;x++){for(let c=0;c<3;c++){let acc=0;for(let y=-r;y<=r;y++)acc+=src[(clamp(y,0,h-1)*w+x)*4+c];for(let y=0;y<h;y++){dst[(y*w+x)*4+c]=acc/div;acc+=src[(Math.min(y+r+1,h-1)*w+x)*4+c]-src[(Math.max(y-r,0)*w+x)*4+c];}}}}
  function tri(src,dst,w,h,horiz){for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;let a,b;if(horiz){a=(y*w+Math.max(x-1,0))*4;b=(y*w+Math.min(x+1,w-1))*4;}else{a=(Math.max(y-1,0)*w+x)*4;b=(Math.min(y+1,h-1)*w+x)*4;}for(let c=0;c<3;c++)dst[i+c]=.25*src[a+c]+.5*src[i+c]+.25*src[b+c];}}
  function blur(img,sigma){
    if(sigma<.25)return;
    const w=img.width,h=img.height,d=img.data,tmp=new Float32Array(d.length),buf=new Float32Array(d.length);
    for(let i=0;i<d.length;i++)buf[i]=d[i];
    if(sigma<.9){tri(buf,tmp,w,h,true);tri(tmp,buf,w,h,false);}
    else{const r=Math.max(1,Math.round((Math.sqrt(4*sigma*sigma+1)-1)/2));for(let p=0;p<3;p++){boxH(buf,tmp,w,h,r);boxV(tmp,buf,w,h,r);}}
    for(let i=0;i<d.length;i+=4){d[i]=buf[i];d[i+1]=buf[i+1];d[i+2]=buf[i+2];}
  }
  function motion(img,len){
    const r=Math.round(len/2);if(r<1)return;
    const w=img.width,h=img.height,d=img.data,buf=new Float32Array(d.length),tmp=new Float32Array(d.length);
    for(let i=0;i<d.length;i++)buf[i]=d[i];
    boxH(buf,tmp,w,h,r);
    for(let i=0;i<d.length;i+=4){d[i]=tmp[i];d[i+1]=tmp[i+1];d[i+2]=tmp[i+2];}
  }
  function blurOf(S,O){return Math.hypot(O.dofPx,O.diffPx,S.colorCam?.55:0)*.5;}

  const GT=new Float32Array(1<<16);{const r=mulberry32(7);for(let i=0;i<GT.length;i++){const u=Math.max(r(),1e-9),v=r();GT[i]=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}}
  let gi=0;
  function addNoise(src,dst,E,S,t){
    const a=E.noiseA*255,fl=E.flick*255*Math.sin(t*6.1)*.8;
    const s=src.data,o=dst.data,mono=!S.colorCam,n=s.length;
    const sq=new Float32Array(256);for(let v=0;v<256;v++)sq[v]=a+E.noiseB*255*Math.sqrt(Math.max(v/255,.02));
    for(let i=0;i<n;i+=4){
      if(mono){const v=s[i];const x=v+sq[v]*GT[gi++&65535]+fl;o[i]=o[i+1]=o[i+2]=x;}
      else{o[i]=s[i]+sq[s[i]]*GT[gi++&65535]+fl;o[i+1]=s[i+1]+sq[s[i+1]]*GT[gi++&65535]+fl;o[i+2]=s[i+2]+sq[s[i+2]]*GT[gi++&65535]+fl;}
      o[i+3]=255;
    }
    gi=(gi+(Math.random()*65536|0))&65535;
  }

  /* ---- public: full frame ---- */
  function frame(S,E,maxW){
    const O=E.O,cam=O.cam;
    const rw=Math.max(80,Math.min(maxW||720,cam.px[0])),rh=Math.max(60,Math.round(rw*O.fovH/O.fovW));
    const cv=mk(rw,rh),ctx=cv.getContext('2d');
    const s=rw/O.fovW,k=rw/cam.px[0];
    drawScene(ctx,S,E,{s,cx:0,cy:0,w:rw,h:rh});
    const img=ctx.getImageData(0,0,rw,rh);
    blur(img,blurOf(S,O)*k);
    if(O.motionPx*k>.8)motion(img,O.motionPx*k);
    return{img,rw,rh,s,k,native:rw===cam.px[0]};
  }
  /* ---- public: 1:1 sensor pixels around a point (mm) ---- */
  function loupe(S,E,mx,my,n){
    const O=E.O,ss=4,W=n*ss;
    const cv=mk(W,W),ctx=cv.getContext('2d');
    drawScene(ctx,S,E,{s:ss/O.mmpp,cx:mx,cy:my,w:W,h:W});
    const img=ctx.getImageData(0,0,W,W);
    blur(img,blurOf(S,O)*ss);
    if(O.motionPx>.2)motion(img,O.motionPx*ss);
    const out=new ImageData(n,n),d=img.data,o=out.data;
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){let r=0,g=0,b=0;for(let j=0;j<ss;j++)for(let i=0;i<ss;i++){const p=((y*ss+j)*W+x*ss+i)*4;r+=d[p];g+=d[p+1];b+=d[p+2];}const q=(y*n+x)*4,m=ss*ss;o[q]=r/m;o[q+1]=g/m;o[q+2]=b/m;o[q+3]=255;}
    return out;
  }
  return{frame,loupe,addNoise,css};
})();

/* ================= 3D bench (three.js r128) ================= */
const Bench=(()=>{
  let T,R,scene,cam,host,envTex,partG,rigG,markG,pickMesh,beltTex,beltMesh,backPanel;

  let lost=false;
  let S=null,E=null,cb={},beams=true,run=true,partX=0,lastT=0,flashT=0,topY=0,cartonH=0,lightMats=[],beamMats=[],sceneLights=[],markers=[];
  let armed=false,down=null,triggerCool=0;

  function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#101722';}
  function disposeTree(o){o.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material){(Array.isArray(c.material)?c.material:[c.material]).forEach(m=>{if(m.map)m.map.dispose();m.dispose();});}});}

    panel(0,80,0,70,70);panel(80,40,30,30,60);panel(-70,30,-50,40,30);

  }

  function makeBelt(){
    const cv=document.createElement('canvas');cv.width=256;cv.height=256;const c=cv.getContext('2d');
    c.fillStyle='#2a2c30';c.fillRect(0,0,256,256);
    const r=mulberry32(3);
    for(let i=0;i<2500;i++){const v=36+r()*14|0;c.fillStyle=`rgb(${v},${v},${v+2})`;c.fillRect(r()*256,r()*256,1.5,1.5);}
    c.fillStyle='rgba(255,255,255,.05)';for(let x=0;x<256;x+=64)c.fillRect(x,0,2,256);

  function init(el,callbacks){

  /* ---------- pointer: orbit, zoom, click to place ---------- */

    el.addEventListener('pointermove',e=>{
      if(!down){el.style.cursor=armed&&hitPart(e)?'crosshair':'grab';return;}
      const dx=e.clientX-down.x,dy=e.clientY-down.y;
      if(Math.hypot(dx,dy)>4)down.moved=true;
      if(down.moved){ob.userMoved=true;ob.goal.th=down.th-dx*.008;ob.goal.ph=clamp(down.ph-dy*.008,.03,1.52);el.style.cursor='grabbing';}
    });
    el.addEventListener('pointerup',e=>{
      if(down&&!down.moved){const h=hitPart(e);if(h&&cb.onPick)cb.onPick(h.u,h.v);}

    });

  }
  const ray=()=>new T.Raycaster();
  function hitPart(e){
    if(!pickMesh||!S)return null;

    const m=new T.Vector2((e.clientX-rc.left)/rc.width*2-1,-(e.clientY-rc.top)/rc.height*2+1);
    const rr=ray();rr.setFromCamera(m,cam);

    if(!inShape(P,x,y)){

  }

  /* ---------- part ---------- */
  function decalCanvas(P,pad){
    const W=1400,sc=W/(P.w+pad*2),H=Math.round((P.h+pad*2)*sc);
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
    c.translate(W/2,H/2);c.scale(sc,sc);
    const miss=missingSet(S);
    const px=1/sc;
    // part-level visible features
    for(const f of(P.feats||[])){
      c.strokeStyle='rgba(0,0,0,.18)';c.lineWidth=.5;
      if(f.k==='ring'){c.beginPath();c.arc(0,0,f.r,0,6.2832);c.stroke();}
      else if(f.k==='ticks'){c.lineWidth=.35;c.beginPath();for(let k=0;k<48;k++){const a=k/48*Math.PI*2;c.moveTo(Math.cos(a)*f.r,Math.sin(a)*f.r);c.lineTo(Math.cos(a)*(f.r+1.3),Math.sin(a)*(f.r+1.3));}c.stroke();}
      else if(f.k==='vent'){c.lineWidth=.7;for(let k=0;k<4;k++){c.beginPath();c.arc(0,0,3.6,k*Math.PI/2+.25,k*Math.PI/2+1.3);c.stroke();}}
      else if(f.k==='ribs'){c.lineWidth=.9;c.strokeStyle='rgba(255,255,255,.08)';c.beginPath();for(let x=-12;x<=12;x+=6){c.moveTo(x,-12);c.lineTo(x,12);}c.stroke();}
    }
    featureList(P).forEach((f,i)=>{
      if(f.kind==='comp'&&miss.has(i)){const cc=f.src;c.fillStyle='#c8a060';const pw=Math.min(cc.w*.3,1.4);c.fillRect(cc.x-cc.w/2,cc.y-cc.h/2,pw,cc.h);c.fillRect(cc.x+cc.w/2-pw,cc.y-cc.h/2,pw,cc.h);}
      if(f.kind==='print'&&!miss.has(i)){
        const b=f.src,r=mulberry32(hashStr('print'+b.x));c.fillStyle=PRINT_COLOR;c.strokeStyle=PRINT_COLOR;const x0=b.x-b.w/2,y0=b.y-b.h/2;
        if(b.bars){let x=x0;while(x<x0+b.w){const bw=.33*(1+Math.floor(r()*3));c.fillRect(x,y0,bw,b.h*.82);x+=bw+.33*(1+Math.floor(r()*3));}}
        else if(b.text){let x=x0;while(x<x0+b.w){const cw=1.3+r()*1.2;c.fillRect(x,y0,cw,b.h);x+=cw+(r()<.18?1.8:.5);}}
        else{c.lineWidth=.6;c.strokeRect(x0,y0,b.w,b.h);const n=12,cs=(b.h-2)/n;for(let yy=0;yy<n;yy++)for(let xx=0;xx<n;xx++)if(r()<.5)c.fillRect(x0+b.w-b.h+1+xx*cs,y0+1+yy*cs,cs,cs);}
      }
    });
    if(P.shape==='rect'&&S.part==='pcb'){c.strokeStyle='rgba(210,180,90,.55)';c.lineWidth=.35;c.beginPath();c.moveTo(-8,-4);c.lineTo(8,-10);c.moveTo(-8,2);c.lineTo(16,9);c.moveTo(-22,-4);c.lineTo(-30,-12);c.stroke();}
    // defects, in the colors a person would see
    const base=S.color,dark=hexRgb(base).reduce((a,b)=>a+b,0)/3<.45;
    S.defects.forEach((d,i)=>{
      const D=DEFS[d.type],G=defGeom(S,d);const w=Math.max(G.w,1.6*px),l=G.l;
      const rng=mulberry32(hashStr(d.type)+i*7919);
      c.save();
      if(D.kind==='edge'){
        const a=G.a;c.translate(a.x+(d.type==='burr'?a.nx*G.w*.45:0),a.y+(d.type==='burr'?a.ny*G.w*.45:0));c.rotate(Math.atan2(a.ny,a.nx));
        c.fillStyle=d.type==='chip'?(dark?'#6d7178':'#2a2c30'):mixHex(base,dark?'#000000':'#ffffff',.12);
        c.beginPath();c.ellipse(0,0,d.type==='chip'?G.w:G.w*.55,G.l/2,0,0,6.2832);c.fill();c.restore();return;
      }
      if(D.kind==='feature'){c.restore();return;}
      c.translate(G.x,G.y);c.rotate((d.ang||0)*Math.PI/180);
      const dc=defColor(S,d);
      if(D.shape==='line'){c.strokeStyle=mixHex(base,dark?'#ffffff':'#ffffff',.55);c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(-l/2,0);c.lineTo(l/2,0);c.stroke();c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=w*.4;c.beginPath();c.moveTo(-l/2,w*.5);c.lineTo(l/2,w*.5);c.stroke();}
      else if(D.shape==='crack'){c.strokeStyle=darken(base,.7);c.lineWidth=w;c.beginPath();const n=12;for(let k=0;k<=n;k++){const x=-l/2+l*k/n,y=(k&&k<n)?(rng()-.5)*l*.09:0;k?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();}
      else if(D.shape==='dent'){const g=c.createRadialGradient(-G.w*.12,-G.w*.12,0,0,0,G.w/2);g.addColorStop(0,'rgba(0,0,0,.28)');g.addColorStop(.7,'rgba(255,255,255,.18)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,G.w/2,0,6.2832);c.fill();}
      else if(D.shape==='blob'){c.fillStyle=D.fluor?'rgba(255,255,255,.1)':dc;c.globalAlpha=D.fluor?1:.85;c.beginPath();c.ellipse(0,0,w/2,l/2,0,0,6.2832);c.fill();if(D.fluor){c.strokeStyle='rgba(255,255,255,.18)';c.lineWidth=.2;c.stroke();}}
      else if(D.shape==='dot'){c.fillStyle=dc;c.beginPath();c.arc(0,0,w/2,0,6.2832);c.fill();}
      else if(D.shape==='bubble'){c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=Math.max(w*.15,px);c.beginPath();c.arc(0,0,w/2,0,6.2832);c.stroke();}
      else if(D.shape==='smear'){c.strokeStyle=dc;c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(-l/2,0);c.bezierCurveTo(-l/6,w*.8,l/6,-w*.6,l/2,w*.3);c.stroke();}

  }
  function shapeFor(P,miss){
    const sh=new T.Shape();
    if(P.shape==='rect'){const hw=P.w/2,hh=P.h/2,r=Math.min(1.2,hw*.05);sh.moveTo(-hw+r,-hh);sh.lineTo(hw-r,-hh);sh.quadraticCurveTo(hw,-hh,hw,-hh+r);sh.lineTo(hw,hh-r);sh.quadraticCurveTo(hw,hh,hw-r,hh);sh.lineTo(-hw+r,hh);sh.quadraticCurveTo(-hw,hh,-hw,hh-r);sh.lineTo(-hw,-hh+r);sh.quadraticCurveTo(-hw,-hh,-hw+r,-hh);}

    if(P.shape==='ring'){const h=new T.Path();h.absarc(0,0,P.inner,0,Math.PI*2,true);sh.holes.push(h);}
    (P.holes||[]).forEach((h,i)=>{if(miss.has(i))return;const p=new T.Path();p.absarc(h[0],-h[1],h[2],0,Math.PI*2,true);sh.holes.push(p);});

  function buildPart(){
    disposeTree(partG);partG.clear();markG=new T.Group();partG.add(markG);markers=[];
    const P=PARTS[S.part],M=MATS[S.material],miss=missingSet(S);
    cartonH=P.carton?90:0;
    const base=cartonH+(S.tech==='back'?4:0);
    topY=base+P.t;
    if(P.carton){const cb=new T.Mesh(new T.BoxGeometry(P.w+60,cartonH,P.h+50),mat({color:0xb28a5c,roughness:.9,metalness:0}));cb.position.y=cartonH/2;partG.add(cb);
      const tape=new T.Mesh(new T.BoxGeometry(P.w+60.2,.4,18),mat({color:0xc9a878,roughness:.4}));tape.position.set(0,cartonH+.1,-(P.h+50)/2+30);partG.add(tape);}

    if(S.part==='cell'){const top=new T.Mesh(new T.CylinderGeometry(P.w/2*.62,P.w/2*.62,.8,48),mat({color:S.color,metalness:t3.metal,roughness:t3.rough}));top.position.y=topY+.4;partG.add(top);}

  /* ---------- camera, lens, light ---------- */
  function lightColor(){const c=LCOL[S.lcolor];return new T.Color(S.lcolor==='ir'?'#4a0a16':c.disp);}
  function glowMat(k){const m=new T.MeshStandardMaterial({color:0x111111,emissive:lightColor(),emissiveIntensity:k,roughness:.4,side:T.DoubleSide});m.userData.k=k;lightMats.push(m);return m;}

    const glass=new T.Mesh(new T.CircleGeometry(lr*.78,40),new T.MeshStandardMaterial({color:0x162030,metalness:1,roughness:.05,envMap:envTex}));glass.rotation.x=Math.PI/2;glass.position.y=-.05;lg.add(glass);

    }

    const big=camd.px[0]>=4000;const bs=big?48:29,bl=big?58:42;
    const body=new T.Mesh(new T.BoxGeometry(bs,bl,bs),mat({color:0x2d5c9e,metalness:.55,roughness:.4}));body.position.y=y+bl/2;rigG.add(body);
    const back=new T.Mesh(new T.BoxGeometry(bs+.4,6,bs+.4),blk);back.position.y=y+bl-3;rigG.add(back);
    const led=new T.Mesh(new T.BoxGeometry(3,3,1),new T.MeshBasicMaterial({color:0x33ff88}));led.position.set(bs/4,y+bl-3,bs/2+.5);rigG.add(led);
    const cable=new T.Mesh(new T.CylinderGeometry(3,3,90,12),blk);cable.position.set(0,y+bl+45,0);rigG.add(cable);

    const clampM=new T.Mesh(new T.BoxGeometry(bs+10,18,bs+10),blk);clampM.position.set(0,armY,0);clampM.scale.set(1,.8,1);rigG.add(clampM);
    const arm3=new T.Mesh(new T.BoxGeometry(14,14,75),silver);arm3.position.set(0,armY,-40);rigG.add(arm3);
    const arm4=new T.Mesh(new T.BoxGeometry(260,14,14),silver);arm4.position.set(-130,armY,-75);rigG.add(arm4);

/* ---------- placing defects ---------- */
function arm(t){
  app.armed=t;
  const tip=$('#armedTip');
  if(t){tip.textContent=`Click the part to place a ${DEFS[t].name.toLowerCase()}`;tip.classList.remove('hide');}
  else tip.classList.add('hide');
  $('#sensorBox').classList.toggle('armed',!!t);
  if(benchOK)Bench.setArmed(!!t);
  if(app.E)syncControls();
}
function placeAt(u,v){
  const S=app.S,P=PARTS[S.part],t=app.armed;if(!t)return false;
  const D=DEFS[t],x=(u-.5)*P.w,y=(v-.5)*P.h;
  if(D.kind==='surface'&&!inShape(P,x,y)){toast('Surface defects go on the part surface. Click inside the outline.');return false;}
  if(D.kind==='feature'&&!featureList(P).length){toast(`The ${P.name.toLowerCase()} has no holes, components or print to leave out.`);return false;}
  S.defects.push(mkDefect(t,{u,v,ang:D.round?0:Math.round((Math.random()*120-60)/5)*5}));
  app.sel=S.defects.length-1;
  arm(null);
  changed();
  return true;
}

function paintSensor(){
  if(!fd||!noisy)return;
  Sensor.addNoise(fd.img,noisy,app.E,app.S,performance.now()/1000);
  if($('#clipTog').checked){
    const d=noisy.data,c=fd.img.data,w=noisy.width,h=noisy.height;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;
      if(c[i]>=250&&c[i+1]>=250&&c[i+2]>=250){if(((x+y)&7)<4){d[i]=255;d[i+1]=60;d[i+2]=60;}}
      else if(c[i]<=1&&c[i+1]<=1&&c[i+2]<=1&&((x-y)&7)<4){d[i]=40;d[i+1]=90;d[i+2]=255;}}
  }
  sCtx.putImageData(noisy,0,0);
}

  {sel:'#stage3d',title:'The bench',text:'The camera, lens and light are shown as they would sit on the line, with the field of view drawn on the part. Drag to orbit, scroll to zoom.'},
  {sel:'#sensorBox',title:'What the camera sees',text:'This is the simulated image, with real glare, blur and noise. Hover it to open a loupe showing true sensor pixels.'},
  {sel:'#secLight .seg',title:'Choose the lighting',text:'Technique first, then color, size and angle. Watch the camera image change as you switch: this is where most inspections are won or lost.'},
  {sel:'#secOpt',title:'Camera and lens',text:'Set the working distance, aperture and sensor. The readout tells you the field of view, millimetres per pixel and depth of field.'},
  {sel:'#captureBtn',title:'Capture and grade',text:'When every defect stands out, capture. You get stars, a per-defect result, and the expert setup with the reasoning behind it.'},
];
let tourI=0,tourEls=null;
function endTour(){
  if(tourEls){tourEls.wrap.remove();tourEls.card.remove();document.querySelectorAll('.coach-on').forEach(e=>e.classList.remove('coach-on'));tourEls=null;}
  store.toured=true;save();
}
function tourStep(i){
  const st=TOUR[i];if(!st){endTour();return;}
  document.querySelectorAll('.coach-on').forEach(e=>e.classList.remove('coach-on'));
  const el=document.querySelector(st.sel);
  if(!el){tourStep(i+1);return;}
  if(document.body.dataset.tab){const col=el.closest('.benchcol')?'bench':el.closest('.inspect')?'image':'setup';setTab(col);}
  el.scrollIntoView({block:'center',behavior:'smooth'});
  el.classList.add('coach-on');
  const r=el.getBoundingClientRect(),card=tourEls.card;
  card.replaceChildren(
    h('h4',null,st.title),h('p',null,st.text),
    h('div',{class:'cfoot'},h('div',{class:'dots'},TOUR.map((_,k)=>h('i',{class:k===i?'on':''}))),
      h('button',{class:'btn ghost',onclick:endTour},'Skip'),
      h('button',{class:'btn primary','data-focus':true,onclick:()=>{tourI++;tourStep(tourI);}},i===TOUR.length-1?'Start':'Next')));
  const cw=Math.min(320,window.innerWidth-24),ch=card.offsetHeight||150;
  let left=clamp(r.left+r.width/2-cw/2,12,window.innerWidth-cw-12);
  let top=r.bottom+14;if(top+ch>window.innerHeight-12)top=Math.max(12,r.top-ch-14);
  card.style.left=left+'px';card.style.top=top+'px';
  card.querySelector('.primary').focus();
}
function startTour(force){
  if(!force&&store.toured)return;
  if(tourEls)endTour();
  const wrap=h('div',{class:'coachwrap',onclick:endTour}),card=h('div',{class:'coachcard',role:'dialog'});
  document.body.append(wrap,card);tourEls={wrap,card};tourI=0;tourStep(0);
}

/* ---------- home / job board ---------- */
let heroTimer=0;
function openHome(){
  const S=app.S;
  const hero=h('div',{class:'hero'},
    h('div',null,h('h2',null,'Can your camera see the defect?'),
      h('p',null,'Pick the light, lens and camera for real inspection jobs, place defects anywhere on the part, and check what the sensor actually captures. Every job ends with the setup an experienced vision engineer would quote, and why it works.'),
      h('div',{class:'cta'},h('button',{class:'btn primary big','data-focus':true,onclick:()=>{closeModal();const c=CHALLENGES.find((c,i)=>unlocked(i)&&!(store.stars[c.id]>=3))||CHALLENGES[0];startJob(c);}},totalStars()?'Continue jobs':'Start the first job'),
        h('button',{class:'btn big',onclick:()=>{closeModal();startFree();}},'Open the free bench'))),
    h('div',{class:'hero-art'},h('canvas',{id:'heroCv'}),h('span',{class:'tag',id:'heroTag'})));
  const n=totalStars();
  const ua=h('input',{type:'checkbox'});ua.checked=!!store.unlockAll;
  ua.addEventListener('change',()=>{store.unlockAll=ua.checked;save();closeModal();openHome();});
  const head=h('div',{class:'jobs-head'},h('h3',null,'Customer jobs'),h('span',{class:'rank'},starsEl(1),h('b',null,`${n}/${CHALLENGES.length*3}`),rankName(n)),tog('Open all jobs',null,ua));
  const jobs=h('div',{class:'jobs'},CHALLENGES.map((c,i)=>{
    const ok=unlocked(i),st=store.stars[c.id]||0;
    return h('button',{class:'job',disabled:ok?null:true,onclick:()=>{closeModal();startJob(c);}},
      ok?null:h('span',{html:LOCK,style:{display:'contents'}}),
      h('span',{class:'n'},`Job ${i+1}`),h('h4',null,c.title),h('span',{class:'cl'},`${c.client}, ${c.industry.toLowerCase()}`),
      h('span',{class:'jf'},starsEl(st),h('span',{class:'diff','aria-label':`Difficulty ${DIFF[c.id]} of 5`},[1,2,3,4,5].map(k=>h('i',{class:k<=DIFF[c.id]?'on':''})))),
      store.assisted[c.id]?h('span',{class:'assist'},'Assisted'):null,
      ok?null:h('span',{class:'hint'},'Earn a star on the previous job to open'));
  }));
  const foot=h('p',{class:'hint',style:{padding:'0 28px 22px'}},'Progress is saved in this browser only. Share the link and everyone keeps their own score.');
  modal([hero,head,jobs,foot],{cls:'home',sticky:!S});
  startHero();
}
function startHero(){
  clearInterval(heroTimer);
  const cv=$('#heroCv');if(!cv)return;
  const c=CHALLENGES[1];const base=jobState(c);
  Object.assign(base,{cam:'imx264',lens:'f25',N:4});base.wd=fitWd(base);
  const shots=[['ring','white','Ring light: the scratches hide inside the glare'],['coax','white','Coaxial light: tilted surfaces turn dark'],['darkfield','white','Dark field: scratches and dents glow'],['dome','white','Dome: diffuse light hides the damage']].map(([t,l,txt])=>{
    const S={...base,tech:t,lcolor:l};S.lsize=pickSize(t,PARTS[S.part]);S.wd=Math.max(S.wd,lightClearance(S));S.ambient='low';autoExpose(S);const E=evaluate(S);return{S,E,f:Sensor.frame(S,E,640),txt};});
  let k=0,t=0;const ctx=cv.getContext('2d');let out=null;
  const show=()=>{const s=shots[k];cv.width=s.f.rw;cv.height=s.f.rh;out=new ImageData(s.f.rw,s.f.rh);const tag=$('#heroTag');if(tag)tag.textContent=s.txt;};
  show();
  heroTimer=setInterval(()=>{if(!document.body.contains(cv)){clearInterval(heroTimer);return;}t++;if(t%28===0){k=(k+1)%shots.length;show();}const s=shots[k];Sensor.addNoise(s.f.img,out,s.E,s.S,t/10);ctx.putImageData(out,0,0);},100);
}

/* ---------- modes ---------- */
function startJob(c){
  app.mode='job';app.job=c;app.S=jobState(c);app.sel=-1;app.captured=null;app.changed=true;app.revealed=false;arm(null);
  store.lastJob=c.id;store.lastMode='job';save();
  renderBrief();if(benchOK)Bench.frame('iso');changed();
  setTimeout(()=>{if(!mroot.firstChild)startTour();},700);
}
function startFree(){
  app.mode='free';app.S=store.free&&store.free.defects?store.free:freeState();
  app.S.defects.forEach(d=>{d.id=uid++;});
  app.sel=-1;app.captured=null;app.changed=true;app.revealed=false;arm(null);
  store.lastMode='free';save();
  renderBrief();if(benchOK)Bench.frame('iso');changed();
  setTimeout(()=>{if(!mroot.firstChild)startTour();},700);
}
function resetSetup(){
  if(app.mode==='job'){const d=app.S.defects;app.S=jobState(job());app.S.defects=d;}
  else{Object.assign(app.S,SETUP);app.S.lsize=pickSize('ring',PARTS[app.S.part]);}
  changed();toast('Hardware reset');
}

/* ---------- boot ---------- */
if(store.theme)document.documentElement.dataset.theme=store.theme;
$('#themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;store.theme=nx;save();
  if(benchOK){Bench.theme();Bench.update(app.S,app.E);}drawOverlay();
});
$('#homeBtn').addEventListener('click',openHome);
$('#helpBtn').addEventListener('click',openHelp);
$('#copyBtn').addEventListener('click',copySpec);
function setTab(t){document.body.dataset.tab=t;$('#tabbar').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===t)));if(t!=='setup')setTimeout(()=>{drawOverlay();},60);}
$('#tabbar').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
setTab('bench');
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
  if(e.key==='?'||(e.key==='/'&&e.shiftKey)){e.preventDefault();openHelp();return;}
  if(mroot.firstChild||tourEls)return;
  const k=e.key.toLowerCase();
  const tech=Object.keys(LIGHTS);
  if(k>='1'&&k<='6'){const n=tech[+k-1];if(n){const S=app.S;S.tech=n;S.lsize=pickSize(n,PARTS[S.part]);S.wd=Math.max(S.wd,lightClearance(S));if(n==='back')S.pol=false;changed();}return;}
  if(k==='c'){capture();e.preventDefault();}
  else if(k==='x')openExpert();
  else if(k==='j')openHome();
  else if(k==='v'&&benchOK){const order=['iso','top','side'];app._v=((app._v||0)+1)%3;Bench.frame(order[app._v]);}
  else if(k==='a'){autoExpose(app.S);changed();toast('Exposure set for the brightest surface');}
  else if(k==='f'){app.S.wd=fitWd(app.S);changed();}
  else if(k==='m'){const c=$('#overlayTog');c.checked=!c.checked;c.dispatchEvent(new Event('change'));}
  else if(k==='l'){const c=$('#loupeTog');c.checked=!c.checked;c.dispatchEvent(new Event('change'));}
});
$('#captureBtn').addEventListener('click',capture);
$('#expertBtn').addEventListener('click',openExpert);
$('#resetBtn').addEventListener('click',resetSetup);
$('#viewIso').addEventListener('click',()=>benchOK&&Bench.frame('iso'));
$('#viewTop').addEventListener('click',()=>benchOK&&Bench.frame('top'));
$('#viewSide').addEventListener('click',()=>benchOK&&Bench.frame('side'));
$('#beamsTog').addEventListener('change',e=>benchOK&&Bench.setBeams(e.target.checked));
$('#runTog').addEventListener('change',e=>benchOK&&Bench.setRun(e.target.checked));

buildControls();
let benchOK=false;
try{
  benchOK=Bench.init($('#stage3d'),{
    onPick:(u,v)=>{if(app.armed)placeAt(u,v);},
    markerColor:(i,x)=>{const st=getComputedStyle(document.documentElement);if(showVerdicts()&&x)return(st.getPropertyValue(x.verdict==='pass'?'--pass':x.verdict==='marginal'?'--warn':'--fail').trim()||'#3fc1c9');return st.getPropertyValue('--optic').trim()||'#3fc1c9';},
    showMarkers:()=>$('#overlayTog').checked,
  });
}catch(e){console.error(e);benchOK=false;}
if(!benchOK){const m=$('#stageMsg');m.textContent='The 3D bench needs WebGL, which this browser has turned off. The camera image and grading still work.';m.classList.remove('hide');}
const lastC=CHALLENGES.find(c=>c.id===store.lastJob);
if(store.lastMode==='free')startFree();else startJob(lastC&&unlocked(CHALLENGES.indexOf(lastC))?lastC:CHALLENGES[0]);
openHome();
window.visionBench={app,startJob,startFree,openExpert,capture,changed,closeModal,startTour,openHelp,store,Bench:()=>benchOK&&Bench};
})();

</script>
</body>
</html>
